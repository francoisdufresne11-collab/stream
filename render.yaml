services:
  - type: web
    name: streamcaster
    runtime: docker
    dockerfilePath: ./Dockerfile
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 100 --bind 0.0.0.0:$PORT --timeout 120 --keep-alive 5 --log-level info --access-logfile - --error-logfile - app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: "admin2026"
    healthCheckPath: /
    autoDeploy: true
    plan: starter
